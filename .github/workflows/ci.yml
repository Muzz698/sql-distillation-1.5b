name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (dev only, no heavy ML extras)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -m "not slow"

      # Re-scores saved predictions on a fixed Spider-dev subset. No model or GPU needed.
      # The fixtures are added in Phase 3; until then this step is skipped.
      - name: Eval regression check
        if: hashFiles('tests/fixtures/eval_subset/predictions.jsonl') != ''
        run: make ci-eval
