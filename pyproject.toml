[project]
name = "distill-sql"
version = "0.1.0"
description = "Distilling large-LLM text-to-SQL ability into a 1.5B model that runs on a laptop."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Muzamil Rajper" }]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    "rich>=13.7",
    "typer>=0.12",
    "psutil>=6.0",
]

[project.optional-dependencies]
# Experiment tracking UI. Local inference uses the `llama-server` binary from llama.cpp
# (`brew install llama.cpp`), so no Python bindings or C compiler are needed.
eval = [
    "mlflow>=2.16",
]
# Phase 4–5: installed inside the Kaggle notebook (torch is preinstalled there).
train = [
    "transformers>=4.46",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
]
# Phase 7
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
]
# Phase 9
demo = ["gradio>=5.0"]

[project.scripts]
distill-sql = "distill_sql.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "types-tqdm>=4.70.0.20260906",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distill_sql"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks", "src/distill_sql/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

exclude = ["src/distill_sql/third_party/"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "mlflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["distill_sql.third_party.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: needs downloaded data or network; skipped in CI",
]
