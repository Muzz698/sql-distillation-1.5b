# Shared defaults. Phase-specific configs extend this file via `extends:`.
# All paths are relative to the project root unless absolute.
seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  cache_dir: data/cache        # teacher API responses (sha256-keyed)
  runs_dir: runs               # one folder per run: config + metrics + git sha

model:
  base_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
  # Optional ablation (Phase 4+): Qwen/Qwen3.5-2B

datasets:
  spider:
    license: CC-BY-SA-4.0
    source:
      filename: spider_data.zip
      urls:
        - https://drive.usercontent.google.com/download?id=1403EGqzIDoHMdQF4c9Bkyl7dZLZ5Wt6J&export=download&confirm=t
      sha256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b
      extract_to: spider
    train_splits: [train_spider, train_others]   # ONLY these DBs feed synthetic generation
    eval_splits: [dev, test]
    exclude_dbs:
      # Found by `make check-contamination`: BIRD re-uses this exact database (same name and
      # schema fingerprint) in its dev set, so training on it would leak into BIRD Mini-Dev.
      formula_1: "same database as bird_minidev/formula_1 (eval)"
    exclude_empty_dbs: true   # 0-row DBs cannot execution-verify generated SQL
  bird_minidev:
    license: CC-BY-SA-4.0
    source:
      filename: bird_minidev.zip
      urls:
        # Google Drive copy (minidev_0703.zip) linked from github.com/bird-bench/mini_dev.
        # The official OSS mirror (bird-bench.oss-cn-beijing.aliyuncs.com/minidev.zip) is a
        # different build and stalls outside China, so it is not listed: one source, one hash.
        - https://drive.usercontent.google.com/download?id=13VLWIwpw5E3d5DUkMvzw7hvHE67a4XkG&export=download&confirm=t
      sha256: aeb211c0e39010bbdae3838bb5e8bd27dc446ed77495b1709f85ccc9bf67f2be
      extract_to: bird_minidev
    eval_splits: [minidev_sqlite]

schema_extraction:
  sample_rows: 3          # example rows shown per table in prompts
  max_value_chars: 60     # long text cells are truncated in prompts

contamination:
  ngram_n: 13             # GPT-3 / Llama-style n-gram overlap test
  near_dup_shingle_n: 3   # word 3-grams for near-duplicate (Jaccard) matching
  near_dup_jaccard: 0.8
  train_globs:
    - data/processed/train/**/*.jsonl    # synthetic SFT/DPO data (Phase 2+)
    - data/processed/fewshot/*.jsonl     # few-shot exemplars shown to teachers

teachers:
  # Free-tier limits as shown on 2026-10-26; check console.groq.com/settings/limits and
  # aistudio.google.com/rate-limit for your account and edit here. `distill-sql gen models`
  # lists the model ids your keys can actually use.
  - name: groq-gpt-oss-120b
    provider: groq
    model: openai/gpt-oss-120b
    rpm: 30
    tpm: 8000
    rpd: 1000
    tpd: 200000
    extra_body: {reasoning_effort: low}   # reasoning tokens count against TPD
    price_input_per_m: 0.15      # USD, paid list price checked 2026-10-27
    price_output_per_m: 0.6
  - name: groq-qwen3.8-27b
    provider: groq
    model: qwen/qwen3.8-27b
    rpm: 30
    tpm: 8000
    rpd: 1000
    tpd: 200000
    price_input_per_m: 0.8      # USD, paid list price checked 2026-10-27
    price_output_per_m: 4.0
  - name: gemini-flash
    provider: gemini
    # Retired 2026-10-27: the free tier allows only 20 requests/day for this model. Kept (disabled)
    # so the 176 pairs it already produced stay attributed in reports.
    enabled: false
    model: gemini-3.6-flash
    extra_body: {reasoning_effort: low}
    rpm: 10
    tpm: 250000
    rpd: 20
    quota_timezone: America/Los_Angeles
    price_input_per_m: 0.75      # USD, paid list price checked 2026-10-27
    price_output_per_m: 3.75
  - name: gemini-flash-lite
    provider: gemini
    # Chosen 2026-10-27 after a 3-call trial with real prompts (see docs/PLAN.md):
    # 92% kept, medium/hard SQL, 2-4 s per call. gemma-4-31b-it thought for 166 s and returned
    # nothing; gemini-3.5-flash-lite kept 100% but wrote mostly easy SQL.
    # No `reasoning_effort`: with it, this model spends its budget thinking and returns nothing.
    # Google publishes free-tier limits only in AI Studio; the provider's 429 "per day" message
    # stops the job cleanly if the real daily limit is lower than this.
    model: gemini-3.1-flash-lite
    rpm: 15
    tpm: 250000
    rpd: 1000
    quota_timezone: America/Los_Angeles   # Gemini quotas reset at midnight Pacific
    price_input_per_m: 0.25      # USD, paid list price checked 2026-10-27
    price_output_per_m: 1.5

generation:
  output_dir: data/interim/generated   # raw teacher output, append-only, one file per teacher
  pairs_per_call: 8
  calls_per_db: 6          # per teacher; 138 DBs x 6 = 828 calls per teacher for a full pass
  fewshot_per_db: 3        # Spider *train* questions for the same DB, decontaminated
  temperature: 0.8
  max_tokens: 2048         # pilot: real output 500-900 tok (+ Gemini thinking); Groq counts this toward TPM
  focuses:                 # one per call, rotated per DB so every pattern is covered
    - simple lookups on one table with WHERE filters, ORDER BY and LIMIT
    - aggregation with COUNT/SUM/AVG/MIN/MAX, GROUP BY and HAVING
    - joins across two or three tables using the foreign keys
    - nested subqueries (IN, NOT IN, EXISTS, or comparison with an aggregate such as above average)
    - set operations (UNION, INTERSECT, EXCEPT) and "which X have no Y" questions
    - superlatives and ranking (the most, the least, top 3), with COUNT(DISTINCT ...)
    - text and range conditions (LIKE, BETWEEN, comparisons on dates or numbers) combined with joins
    - harder multi-step questions combining joins, grouping and a subquery

verification:
  timeout_s: 5
  max_result_rows: 10000
  min_question_words: 4
  max_question_words: 60
  crosscheck_batch_size: 10

evaluation:
  results_dir: results          # committed: predictions + metrics for every model and set
  models_dir: data/models       # GGUF files (git-ignored)
  timeout_s: 30                 # per query; BIRD gold queries can be slow
  max_new_tokens: 512
  bootstrap_samples: 1000
  local_server: {binary: llama-server, ctx_size: 16384, gpu_layers: 99}
  sets:
    spider_dev: {dataset: spider, split: dev}                          # 1,034 q, full
    bird_minidev: {dataset: bird_minidev, split: minidev_sqlite}       # 500 q, full
    # Fixed, stratified subsets: every model, including rate-limited teachers, is scored on
    # exactly the same questions, so the comparison table is apples to apples.
    spider_dev_200: {dataset: spider, split: dev, n: 200}
    bird_minidev_100: {dataset: bird_minidev, split: minidev_sqlite, n: 100}
    spider_test: {dataset: spider, split: test, final: true}           # run once, at the end
  models:
    base-q8:
      kind: local
      description: Qwen2.5-Coder-1.5B-Instruct, official Q8_0 GGUF (no fine-tuning)
      gguf:
        filename: qwen2.5-coder-1.5b-instruct-q8_0.gguf
        urls:   # pinned to a Hub revision so the baseline never silently changes
          - https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/f86cb2c1fa58255f8052cc32aeede1b7482d4361/qwen2.5-coder-1.5b-instruct-q8_0.gguf
        sha256: 507de59046601282ba768a9789900e6ccf60ed93ddf346730b7c68eb0715bc47
    gpt-oss-120b: {kind: teacher, teacher: groq-gpt-oss-120b, description: "Teacher (Groq)"}
    qwen3.8-27b: {kind: teacher, teacher: groq-qwen3.8-27b, description: "Teacher (Groq)"}
    gemini-3.1-flash-lite: {kind: teacher, teacher: gemini-flash-lite, description: "Teacher (Google)"}

tracking:
  backend: mlflow
  mlflow_uri: file:./mlruns
  experiment: distill-sql
