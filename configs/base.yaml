# Shared defaults. Phase-specific configs extend this file via `extends:`.
# All paths are relative to the project root unless absolute.
seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  cache_dir: data/cache        # teacher API responses (sha256-keyed)
  runs_dir: runs               # one folder per run: config + metrics + git sha

model:
  base_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
  # Optional ablation (Phase 4+): Qwen/Qwen3.5-2B

datasets:
  spider:
    license: CC-BY-SA-4.0
    source:
      filename: spider_data.zip
      urls:
        - https://drive.usercontent.google.com/download?id=1403EGqzIDoHMdQF4c9Bkyl7dZLZ5Wt6J&export=download&confirm=t
      sha256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b
      extract_to: spider
    train_splits: [train_spider, train_others]   # ONLY these DBs feed synthetic generation
    eval_splits: [dev, test]
    exclude_dbs:
      # Found by `make check-contamination`: BIRD re-uses this exact database (same name and
      # schema fingerprint) in its dev set, so training on it would leak into BIRD Mini-Dev.
      formula_1: "same database as bird_minidev/formula_1 (eval)"
    exclude_empty_dbs: true   # 0-row DBs cannot execution-verify generated SQL
  bird_minidev:
    license: CC-BY-SA-4.0
    source:
      filename: bird_minidev.zip
      urls:
        # Google Drive copy (minidev_0703.zip) linked from github.com/bird-bench/mini_dev.
        # The official OSS mirror (bird-bench.oss-cn-beijing.aliyuncs.com/minidev.zip) is a
        # different build and stalls outside China, so it is not listed: one source, one hash.
        - https://drive.usercontent.google.com/download?id=13VLWIwpw5E3d5DUkMvzw7hvHE67a4XkG&export=download&confirm=t
      sha256: aeb211c0e39010bbdae3838bb5e8bd27dc446ed77495b1709f85ccc9bf67f2be
      extract_to: bird_minidev
    eval_splits: [minidev_sqlite]

schema_extraction:
  sample_rows: 3          # example rows shown per table in prompts
  max_value_chars: 60     # long text cells are truncated in prompts

contamination:
  ngram_n: 13             # GPT-3 / Llama-style n-gram overlap test
  near_dup_shingle_n: 3   # word 3-grams for near-duplicate (Jaccard) matching
  near_dup_jaccard: 0.8
  train_globs:
    - data/processed/train/**/*.jsonl    # synthetic SFT/DPO data (Phase 2+)
    - data/processed/fewshot/*.jsonl     # few-shot exemplars shown to teachers

teachers:
  # Free-tier limits as shown on 2026-10-26; check console.groq.com/settings/limits and
  # aistudio.google.com/rate-limit for your account and edit here. `distill-sql gen models`
  # lists the model ids your keys can actually use.
  - name: groq-gpt-oss-120b
    provider: groq
    model: openai/gpt-oss-120b
    rpm: 30
    tpm: 8000
    rpd: 1000
    tpd: 200000
    extra_body: {reasoning_effort: low}   # reasoning tokens count against TPD
  - name: groq-qwen3.8-27b
    provider: groq
    model: qwen/qwen3.8-27b
    rpm: 30
    tpm: 8000
    rpd: 1000
    tpd: 200000
  - name: gemini-flash
    provider: gemini
    model: gemini-2.5-flash
    rpm: 10
    tpm: 250000
    rpd: 250

generation:
  output_dir: data/interim/generated   # raw teacher output, append-only, one file per teacher
  pairs_per_call: 8
  calls_per_db: 6          # per teacher; 138 DBs x 6 = 828 calls per teacher for a full pass
  fewshot_per_db: 3        # Spider *train* questions for the same DB, decontaminated
  temperature: 0.8
  max_tokens: 4096
  focuses:                 # one per call, rotated per DB so every pattern is covered
    - simple lookups on one table with WHERE filters, ORDER BY and LIMIT
    - aggregation with COUNT/SUM/AVG/MIN/MAX, GROUP BY and HAVING
    - joins across two or three tables using the foreign keys
    - nested subqueries (IN, NOT IN, EXISTS, or comparison with an aggregate such as above average)
    - set operations (UNION, INTERSECT, EXCEPT) and "which X have no Y" questions
    - superlatives and ranking (the most, the least, top 3), with COUNT(DISTINCT ...)
    - text and range conditions (LIKE, BETWEEN, comparisons on dates or numbers) combined with joins
    - harder multi-step questions combining joins, grouping and a subquery

verification:
  timeout_s: 5
  max_result_rows: 10000
  min_question_words: 4
  max_question_words: 60
  crosscheck_batch_size: 10

tracking:
  backend: mlflow
  mlflow_uri: file:./mlruns
  experiment: distill-sql
